# Local Postgres for live Spotify mode. Demo mode does not need it.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: playlistiq
      POSTGRES_PASSWORD: playlistiq  # local development only
      POSTGRES_DB: playlistiq
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playlistiq"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
